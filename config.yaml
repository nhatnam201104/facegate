# ==== FaceGate demo - cau hinh ====
# Sua file nay roi chay lai ./run.sh (Linux) hoac run.bat (Windows)

camera:
  # 0 (hoac /dev/video0 tren Linux) = webcam | duong dan file video (vd: data/test.mp4) | RTSP:
  # rtsp://user:pass@192.168.1.64:554/Streaming/Channels/102   (102 = substream Hikvision)
  source: 0
  name: gate-1
  loop_file: true          # file video: phat lap lai de demo

pipeline:
  # edgeface : YuNet + 3DDFA_V2 + EdgeFace-XS (Apache-2.0/MIT/BSD-3) -> mac dinh, toi uu goc 90 do tren CPU
  # opencv   : YuNet + 3DDFA_V2 + SFace (OpenCV Zoo, Apache-2.0)
  # onnx     : SCRFD-500M + ArcFace MobileFaceNet (InsightFace, CHI dung nghien cuu/benchmark)
  # adaface  : YuNet + 3DDFA_V2 + AdaFace-IR18 (CHI dung nghien cuu/benchmark)
  backend: edgeface
  detect_fps: 5            # so lan detect moi giay (3-5 la du)
  det_score: 0.55          # nguong tin cay cua detector (0.55 de bat tot mat nghieng 80-90 do)
  max_faces: 3             # PoC: toi da 3 mat cung luc
  stream_fps: 15           # fps video gui len trinh duyet
  stream_width: 960        # resize khung hinh hien thi

quality:
  min_face: 60             # canh ngan nho nhat cua mat (pixel)
  min_blur: 35             # phuong sai Laplacian toi thieu tren vung da nhin thay
  min_brightness: 45
  max_brightness: 225
  max_yaw: 90              # do, ho tro nhan dien toi goc nghieng suon +-90 do
  max_pitch: 35            # chan goc ngang/cui qua doc
  max_roll: 35             # chan goc nghieng dau qua muc

recognition:
  frontal_max_yaw: 40      # |yaw| <= 40 do: ngan frontal; > 40 do: left_profile / right_profile
  pose_hysteresis: 5       # vung tre +-5 do quanh bien 40 do de khong nhay ngan lien tuc
  thresholds:              # nguong cosine theo backend & nhom goc (nhanh profile chat hon)
    edgeface:
      frontal: 0.40
      profile: 0.46
    opencv:
      frontal: 0.42
      profile: 0.48
    onnx:
      frontal: 0.40
      profile: 0.46
    adaface:
      frontal: 0.40
      profile: 0.46
  margin: 0.06             # top1 - top2 toi thieu cho ngan frontal
  profile_margin: 0.08     # top1 - top2 chat hon cho ngan profile (40-90 do)
  min_good_frames: 2       # so frame frontal toi thieu de chot Best-shot
  min_profile_frames: 4    # so frame profile toi thieu khi khong co frame frontal
  max_track_embeddings: 10
  track_max_age: 2.0       # giay: giu track (an khung) de noi lai khi mat bi che / quay di
  split_cosine: 0.25       # chi so sanh trong cung mot pose_group (tranh cat track khi xoay dau)

events:
  # Moi nhan vien chi check-in 1 lan/ngay; cac lan sau chi hien "Da cham cong luc ..."
  # none: xac nhan dung nguoi that la ghi check-in
  # line: chi ghi khi di qua duong ao theo chieu VAO (in_when)
  direction: none
  line: [[0.0, 0.6], [1.0, 0.6]]   # toa do chuan hoa 0..1 (x, y)
  in_when: down            # down: di tu tren xuong duoi qua line = IN; up: nguoc lai
  log_unknown: true        # luu su kien Unknown de danh gia (khong gui HRM)


liveness:                  # chong gia mao 4 lop dinh tuyen theo goc nhin
  enabled: true
  # Nhanh A (|yaw| <= 40 do): MiniFASNet V2+V1SE
  threshold: 0.70          # TB xac suat "nguoi that" >= muc nay moi duoc cham cong
  spoof_below: 0.35        # TB duoi muc nay = gia mao: canh bao, khong cham cong
  min_frames: 4            # so frame tot toi thieu truoc khi ket luan
  window: 8                # lay trung binh tren N frame gan nhat cua track
  # Nhanh B (40 < |yaw| <= 90 do, va bo tro nhanh A): khong phu thuoc goc mat
  context:
    enabled: true
    person_conf: 0.45      # YOLOX-Nano: nguong tin cay phat hien co the nguoi
    medium_conf: 0.35      # nguong phat hien dien thoai / tablet / man hinh / khung anh
    screen_face_overlap: 0.80  # ti le hop mat nam ben trong hop thiet bi de tinh la mat trong man hinh
    screen_window: 5       # cua so frame gan nhat de kiem tra screen_detected
    screen_min_hits: 3     # so frame toi thieu trong screen_window bao screen_detected moi chot spoof
    require_body_coupling: true
    face_body_ratio: [0.12, 0.65]
  parallax:
    enabled: true
    min_frames: 6          # can >= 6 frame di chuyen de kiem dinh thi sai 3D
    min_travel_ratio: 0.08 # dich chuyen ngang toi thieu = 8% chieu rong khung hinh
    min_depth_score: 0.55  # vuot sai so chieu phang 2D (loai anh phang)
  moire:
    enabled: true
    max_screen_score: 0.65 # chan van luoi pixel man hinh phat video quay san

attendance:
  shift_start: "08:00"
  shift_end: "17:00"
  grace_minutes: 5         # tre/som trong khoang nay van tinh dung gio
  workdays: [1, 2, 3, 4, 5]   # 1 = Thu 2 ... 7 = Chu nhat (tinh vang)

clips:                     # clip video moi lan xuat hien (tab Lich su)
  enabled: true
  fps: 10
  width: 640
  pre_seconds: 2           # lay them truoc khi mat xuat hien
  post_seconds: 1.5        # va sau khi mat roi khung hinh
  max_seconds: 60          # clip dai nhat cho 1 lan xuat hien
  retention_days: 30       # tu xoa clip cu (du lieu sinh trac hoc)


power:                     # che do cho: tranh nhan dien lien tuc 24/7 khi khong co ai
  sleep: true
  idle_seconds: 30         # khong thay mat / chuyen dong trong N giay -> vao che do cho
  motion_threshold: 0.01   # ti le diem anh thay doi de danh thuc (0.01 = 1%); tang neu hay tu bat vi nhieu sang
  sleep_check_fps: 4       # so lan do chuyen dong moi giay khi dang cho
  confirm_seconds: 1.0     # co chuyen dong trong vung -> tim khuon mat trong N giay; khong thay = la cay/bong, ngu tiep
  # Vung loi di (toa do 0..1). Chi chuyen dong trong vung moi danh thuc. Ve tren web: tab Truc tiep > "Vung cua".
  # Vung ve tren web luu o data/settings.json va duoc uu tien hon dong nay.
  motion_zone: [[0.0, 0.0], [1.0, 0.0], [1.0, 1.0], [0.0, 1.0]]

enrollment:
  sample_fps: 10           # tach frame tu video dang ky
  min_frames: 5
  max_frames: 21           # chua du mau chinh dien + nghieng sau 2 ben
  per_bin: 3               # toi da so frame cho moi o goc nhin
  dedup_cosine: 0.95       # 2 frame giong nhau hon muc nay thi bo bot 1
  outlier_min_cosine: 0.42 # kiem tra nhat quan rieng trong tung pose_group
  cross_pose_min_cosine: 0.22  # nguong than trong tam thoi giua tam frontal va tung frame profile
  keep_video: false        # mac dinh xoa video goc sau khi xu ly
  guided:                  # dang ky quay tu camera: 7 goc (5 chu thap + 2 nghieng suon ~80 do)
    enable_profile_90: true
    yaw_enter: 15          # do lech ngang (so voi luc nhin thang) cho goc ban nghieng
    yaw_center: 9          # trong khoang nay la "nhin thang"
    profile_yaw_min: 65    # do lech ngang toi thieu cho 2 buoc nghieng suon sau
    profile_yaw_max: 88
    pitch_enter: 10        # do lech doc de tinh la da ngang/cui
    pitch_center: 8
    hold_seconds: 0.7      # phai giu dung goc lien tuc chung nay
    timeout_seconds: 300   # tong thoi gian toi da cua mot phien

hrm:
  adapter: mock            # mock | erpnext
  erpnext:
    url: http://localhost:8000
    api_key: ""
    api_secret: ""
    device_id: gate-1

storage:
  data_dir: data

server:
  host: 127.0.0.1          # doi thanh 0.0.0.0 neu chay tren Linux server va mo tu may khac trong LAN
  port: 8090
